<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>tinynote</title>
    <style>
        html,
        body,
        #editor {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
    </style>

    <!-- Load Monaco from CDN -->
    <script src="./monaco-editor/0.51.0/min/vs/loader.min.js"></script>
    <!-- <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.51.0/min/vs/loader.min.js"> -->
    </script>

</head>

<body>
    <div id="editor"></div>

    <script>
        // Configure Monaco loader
        require.config({
            paths: {
                vs: "./monaco-editor/0.51.0/min/vs"
                // vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.51.0/min/vs"

            }
        });

        // Match css theme to monaco theme
        function getSystemTheme() {
            return window.matchMedia("(prefers-color-scheme: dark)").matches ? "vs-dark" : "vs";
        }

        // Get Saved content
        const storageKey = "tinynote";
        const defaultValue = "\n".repeat(42);
        const saved = localStorage.getItem(storageKey) || defaultValue;

        require(["vs/editor/editor.main"], function () {
            // Instanciate monaco editor
            const editor = monaco.editor.create(document.getElementById("editor"), {
                value: saved,
                language: "markdown",
                theme: getSystemTheme(),
                minimap: { enabled: false },
                renderWhitespace: true,
                renderLineHighlight: "none",
            });

            // Sync change from other tabs
            window.addEventListener("storage", (e) => {
                if (e.key !== storageKey) return;
                editor.setValue(e.newValue || defaultValue);
            });

            // Sync change to other tabs
            editor.getModel().onDidChangeContent((event) => {
                localStorage.setItem(storageKey, editor.getValue());
            });

            // Listen to system theme changes
            window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", e => {
                const newTheme = e.matches ? "vs-dark" : "vs";
                monaco.editor.setTheme(newTheme);
            });
        });


    </script>
</body>

</html>
